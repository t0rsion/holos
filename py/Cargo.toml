[package]
name = "holos-tda-py"
version = "0.2.0"
edition = "2021"
publish = false

# Standalone: keep this crate out of any enclosing workspace.
[workspace]

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"] }
holos-tda = { path = ".." }

[profile.release]
lto = "thin"
codegen-units = 1
