[package]
name = "holos-tda-py"
version = "0.2.1"
edition = "2021"
publish = false

# Standalone: keep this crate out of any enclosing workspace.
[workspace]

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"] }
# Depend on the published crate, not a path: maturin bundles path dependencies
# into the sdist, which collides with this crate's own README/LICENSE files.
holos-tda = "0.2.1"

[profile.release]
lto = "thin"
codegen-units = 1
