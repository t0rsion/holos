# One-tag release pipeline: version gate, preflight (tests at the tag plus a
# package-extract-retest at the MSRV), wheels and sdist, crates.io, PyPI.
# cargo-dist's release.yml runs on the same tag and creates the GitHub
# release with the binary installers; benchmark records are attached to it
# manually because they are produced on pinned local hardware.
#
# The PyPI trusted publisher is registered against this exact workflow file
# name (wheels.yml); do not rename the file without updating the publisher
# (https://pypi.org/manage/account/publishing/).
#
# crates.io publication needs the CARGO_REGISTRY_TOKEN repository secret.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # On tags, refuse to proceed unless the tag matches every declared version
  # (core crate, py crate, pyproject); a stray or RC v* tag must not publish.
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          v_core=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/holos-tda/Cargo.toml | head -1)
          v_py=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/holos-tda-py/Cargo.toml | head -1)
          v_proj=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/holos-tda-py/pyproject.toml | head -1)
          echo "core=$v_core py=$v_py pyproject=$v_proj ref=$GITHUB_REF"
          [ "$v_core" = "$v_py" ] && [ "$v_core" = "$v_proj" ] || { echo "version mismatch"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [ "$GITHUB_REF" = "refs/tags/v$v_core" ] || { echo "tag does not match version v$v_core"; exit 1; }
          fi

  # Publication is irreversible, so every fallible build and test job runs
  # before it. The extracted-package test would have caught the 0.2.1 sdist
  # bug: it proves the crate builds and passes its tests outside the repo.
  preflight:
    needs: [version-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: On tags, require the tag to lie on the tested main history
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            git fetch origin main:refs/remotes/origin/main
            git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@1.85
      - name: Test the workspace at the tag
        run: cargo +stable test --workspace --locked
      - name: Package, extract, and test the package at the MSRV
        run: |
          cargo +stable package -p holos-tda --locked
          mkdir -p "$RUNNER_TEMP/pkg"
          tar xzf target/package/holos-tda-*.crate -C "$RUNNER_TEMP/pkg"
          cd "$RUNNER_TEMP"/pkg/holos-tda-*
          cargo +1.85 test

  linux:
    needs: [version-check]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/holos-tda-py
          target: ${{ matrix.target }}
          args: --release --locked --out dist --zig
          manylinux: "2_17"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: crates/holos-tda-py/dist

  macos:
    needs: [version-check]
    runs-on: macos-14
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/holos-tda-py
          target: ${{ matrix.target }}
          args: --release --locked --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: crates/holos-tda-py/dist

  windows:
    needs: [version-check]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/holos-tda-py
          target: x86_64
          args: --release --locked --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64
          path: crates/holos-tda-py/dist

  # maturin sdist has no --locked; the path dependency pins the bundled core
  # exactly, and the preflight extracted-package test covers buildability.
  sdist:
    needs: [version-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/holos-tda-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/holos-tda-py/dist

  # Install the built linux x86_64 wheel and run the smoke tests (license
  # texts present, pdist ordering, sparse, moduli, threads, console script).
  smoke:
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist
      - run: |
          pip install dist/*.whl
          python crates/holos-tda-py/tests/smoke.py
          python - <<'EOF'
          import glob, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          licenses = [n for n in names if "licenses/" in n]
          assert any("LICENSE-MIT" in n for n in licenses), names
          assert any("LICENSE-APACHE" in n for n in licenses), names
          print("license files:", licenses)
          EOF

  # A wheel failure must not leave crates.io ahead of PyPI, so this runs
  # after every build and test job. Idempotent: re-tagging after a partial
  # failure skips an already-published version.
  crates-io:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [preflight, linux, macos, windows, sdist, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish unless this version is already on crates.io
        run: |
          V="${GITHUB_REF_NAME#v}"
          if curl -sf -A "holos-release-ci" "https://crates.io/api/v1/crates/holos-tda/$V" > /dev/null; then
            echo "holos-tda $V already published; skipping"
          else
            cargo publish -p holos-tda --locked
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version-check, preflight, crates-io, linux, macos, windows, sdist, smoke]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
