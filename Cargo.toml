[workspace]
resolver = "2"
members = [
    "crates/collapse-bench",
    "crates/engine-bench",
    "crates/holos-tda",
    "crates/holos-tda-check",
    "crates/holos-tda-py",
    "crates/research-bench",
]

# Profiles apply from the workspace root only; member profiles are ignored.
[profile.release]
lto = "thin"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
