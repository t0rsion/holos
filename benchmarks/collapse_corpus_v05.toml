gaps, and file order matches it. A qualifying region is two or more
consecutive entries of one chain. An entry with chain = "none" varies one
axis off its family baseline, stands alone, and belongs to no region. This
mirrors [meta.confirm_chains] of the v0.4 corpus.
"""
