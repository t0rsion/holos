[meta.open_items]
ceiling_predictor = """
cost_weighted_invalidated_fraction, the registered ceiling predictor, is
reported. The driver computes it as the median repair wall time of the
ordered run over the median collapse phase wall time of the serial version 1
run (v1-c1), both medians over the timed repetitions. The registered
predictor names the serial version 1 predicate wall time as the denominator.
The serial path has no separate predicate clock, so this study uses the whole
serial v1 collapse phase, which is measurable and never smaller than that
predicate time; the reported fraction is therefore a lower bound on the
registered one. The same words stand in the runner
(benchmarks/collapse_scaling_ordered.sh) and in the driver's --help, and
every record names the denominator it divided by.
Settle at the version 1 freeze whether the library should clock the serial
predicate separately, which would remove the lower bound. The predictor is
never approximated from counts.
"""
unused_window_capacity = """
Windows never cross a pass boundary, so the tail of each pass runs
underfilled. unused_window_capacity_derived is window_slots_offered minus
window_members_formed: the run's total unused window capacity. It is an
UPPER BOUND on pass-tail loss, not the loss itself. A stage can also
underfill mid-pass, because retiring a window can arm a position the form
scan already passed and open another stage before the pass ends. Separating the two needs a per-stage counter the library does not keep.
RATIFIED at this draft: the grade reports the bound, under its own name,
and does not claim the loss. PLAN section 15 asks every grade to report
pass-tail loss; the bound discharges that obligation because it is
reported, never understated, and can only exceed the loss. A later version
may add the per-stage counter, which would tighten the figure without
changing any grade.
"""
clique_family = """
Carried from the v0.5 corpus: the clusters-at-low-tau approximation stays
(8 Gaussian clusters thresholded below the inter-cluster distance give 8
nearly complete components). No new generator family. The probes keep
headline = false and belong to no region.
"""
smt_points = """
Three entries run collapse_threads {1, 2, 4, 8} on a set of four physical
cores, with the reducer at P as everywhere else: c-clusters-t02-probe and
c-clusters-t015-probe in the screen set, and k-clusters-t02-probe in the
confirmation set. The 8-worker point is an SMT point by the p_rule and is
mapped, not claimed. These entries carry headline = false, and their
shipped-pipeline configuration sits at 8 workers, so it reduces wider than
the baseline and is not the registered arm: the runner marks it
non-registered-arm and the entry backs no end-to-end claim. Decide at the
freeze whether the point stays in the probe list.
"""

