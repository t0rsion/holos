reducer_threads = 4
modulus = [2, 5]
max_dim = [1, 2]
coord_dim = [3, 5]
note = """
collapse_threads and reducer_threads are the defaults for every entry.
{1, P} and P are the headline settings, with P = 4 by the p_rule: the serial
v1 collapse against the ordered collapse at P workers, with the reducer held
fixed at P. Holding the reducer at P is also what makes the shipped pipeline
at P the registered ordered arm, because one pool drives both of its halves.
An entry may override both, and the strong-scaling probes override
collapse_threads.
"""

[meta.design]
block_a = """
The collapse-share block: families and thresholds where the collapse takes
a large share of the pipeline, as the v0.4 and v0.5 studies measured.
clusters and torus at the enclosing radius, cube at low tau, sphere at mid
tau. These carry the headline.
"""
block_b = """
the modulus and max_dim axes, one at a time, off the block-a cells. The
max_dim 1 entries are large: they hold the collapse share up while the
reduction stays small, which is where a serial collapse hurts most.
"""
block_c = """
strong-scaling probes at collapse_threads {1, 2, 4, 8}, on the near-clique
inputs. They map the scaling curve and cannot establish the headline.
"""
note = """
The design is fractional. The screen locates where the ordered collapse
pays; the held-out confirmation set is what any public claim rests on.
"""

