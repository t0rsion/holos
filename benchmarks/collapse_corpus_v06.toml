# Corpus for the ordered speculative collapse study.
#
# FROZEN at version 1 on 2026-08-13; versions 2 to 4 are non-semantic
# header, metadata, and repetition-count amendments, see
# [meta.amendments]. The entries,
# sizes, seeds, and thread counts do not change in response to a result.
# benchmarks/collapse_scaling_ordered.sh refuses a version 0 corpus unless
# ALLOW_DRAFT=1, and marks any such run void.
#
# The decision rule below is frozen.

[meta]
version = 4
date = "2026-08-17"
study = "ordered speculative parallel execution of the version 1 collapse schedule"
runner = "benchmarks/collapse_scaling_ordered.sh"
driver = "crates/collapse-bench"
plan = "registered decision rule included below"
frozen = """
FROZEN at version 1 on 2026-08-13. The three preconditions are met, in
order. The v0.5 registered screen (16/16 clean) and its held-out
confirmation (14/14 clean) ran and were consumed; they graded version 2
parallel-but-Amdahl-limited, which is why this corpus compares the
ordered execution against the SERIAL collapse rather than against
version 2. The window constant k was re-ratified at 32 on the final
instrumented binary, against the same disclosed development grid. P was
re-read from the topology provenance of the pinned set and is 4 physical
cores. Entries, sizes, seeds, and the decision rule do not change in
response to a result; a later version bumps this field and says why.
"""
threshold_rule = """
T = tau * R, where R is the enclosing radius of the cloud, the minimum over i
of the maximum over j of d(i, j). tau = 1.0 reproduces the dense default
threshold exactly. Every configuration of an entry gets the same T, and the
driver holds it fixed across the collapse and the reduction.
"""
sampling_rule = """
One cloud per entry, from gen_cloud.py N COORD_DIM SEED FAMILY. Screen
entries use seed 6607. Confirmation entries use seed 8821 (cube), 8823
(sphere), 8825 (clusters), and 8827 (torus). No entry is resampled: a rerun
of the script regenerates the same cloud.

Every seed of this corpus is new. The registered protocol requires held-out
seeds disjoint from v0.4 and v0.5, and this corpus applies that to the
screen as well, so a screen entry can never share a cloud with a
confirmation entry of an earlier study. None of 42, 4201, 5301, 9137, 9138,
9139, 777, or 778 appears here, in either set.
"""
p_rule = """
P is the number of physical cores in the pinned CPU set at registration,
read from the topology provenance the runner records (_common.sh writes
"cpu topology of allowed set (logical:socket.core)" into every results file). On
the current machine, cpus 0-7 are four physical cores with two SMT threads
each, so P = 4, collapse_threads = [1, 4], and reducer_threads = 4 below.
The reducer is the P-worker reducer of the primary comparison, so it takes
P as well. Points above P, such as 8 workers on that set, are SMT points:
they are descriptive and cannot establish an equal-core claim. If the study
machine changes before registration, P is re-read then and written into
collapse_threads and reducer_threads at the version 1 freeze. The rule is
registered, not the number.

The runner enforces this rule. It refuses to run when the topology of the
allowed CPU set is unknown, and when the P or the reducer_threads of a
headline entry it would run differs from the physical core count of that
set. ALLOW_ANY_TOPOLOGY=1 overrides the refusal and marks the run void.
"""
configurations = """
The driver runs every configuration of an entry in one process and times
each phase on its own clock. No number comes from subtracting one command
line from another. The timed repetitions are counterbalanced: each
repetition starts the configuration cycle one place further on, and the
driver records every repetition's order.

v1-c1   version 1 serial collapse, the pipeline baseline and the reference
        of the ordered gate
v1o-cN  ordered execution of the version 1 schedule, N collapse workers,
        one configuration per collapse_threads value of the entry; v1o-c1
        and v1o-cP (P the last value) are the ones the decision rule reads
v1p-cP  the shipped pipeline at P workers: one run-wide pool drives the
        ordered collapse and then the reduction, which is what
        rips_persistence with collapse_edges and the ordered schedule does
v2-cN   version 2 collapse, N collapse workers, one per collapse_threads
        value, historical context
none    no collapse

That is 2T + 3 configurations for T collapse_threads values: seven on the
headline grid, eleven on the strong-scaling probes.

The phase-split configurations reduce with reducer_threads workers, so the
reducer is held fixed and the collapse is the only variable. The shipped
pipeline takes one worker count for both halves, so v1p-cP reduces with P
workers; with reducer_threads = P that is the registered ordered arm, and
the runner voids a headline entry where the two differ.

v1o-cP and v1p-cP run the same schedule and differ in one thing: v1o builds
a pool for the collapse and lets the reduction build another. The end-to-end
comparison therefore reads v1p-cP, and the v1o phase clocks stay as the
diagnostic that splits the collapse from the reduction.

The diagrams of every configuration must be identical bar for bar before any
timing is recorded. The ordered configurations face the stronger gate: v1o
runs the version 1 schedule, so its collapsed matrix and its whole
certificate must equal v1-c1's, field for field and floats by bits, with the
schedule-fixed counters (input, output and removed edges, passes, witness
segments, and logical_tests against the serial edge_tests). A mismatch voids
the entry. The shipped pipeline returns a diagram and no certificate, so
v1p faces the diagram comparison alone.
"""
measures = """
collapse replacement (the headline): median collapse phase of v1-c1 over
v1o-cP. This is the C1/CP of the v0.5 study read as serial over ordered.
ordered self-scaling: median collapse phase of v1o-c1 over v1o-cP.
product replacement: median total of v1-c1 over median total of v1p-cP, the
shipped one-pool pipeline. The phase-split v1o total is a diagnostic and
enters no ratio: it builds a second pool that the product never builds.
reduction parity: median reduce phase of v1-c1 over v1o-cP. Both reduce the
same matrix, so this ratio sits at 1.0 up to noise; a departure means the
comparison drifted and the entry is read with that in mind.
no-collapse end to end: median total of none, as the outside reference.
work inflation: edge_tests over logical_tests at v1o-cP, the measured side
of the 2L bound.
invalidated cost: invalidated_results, serial_repairs, global_invalidations,
and window_batches at every ordered configuration, plus
cost_weighted_invalidated_fraction (see [meta.open_items]
ceiling_predictor for the denominator this study uses).
window occupancy: window_slots_offered, window_members_formed, and
window_members_reused at v1o-cP, with occupancy = formed over offered.
unused window capacity: offered minus formed, the unfilled window slots of
the run, which bounds pass-tail loss from above.
A stage fills short only when its scan reached the end of the edge list,
which can happen mid-pass: retiring a window can arm a position the form
scan already passed, opening another stage before the pass ends. The figure
is a run total and names no single stage.
collapse subphases: the predicate, retirement, and repair clocks of v1o-cP
from CollapsedRips::timings. Retirement includes the repairs. The serial and
version 2 paths do not clock these, and report them as unavailable.
aggregation: every counter and clock above is a median over the timed
repetitions, taken in the driver, the rule the phase times use. The
agreement run contributes none: its schedule is the same, but its clocks are
one cold sample. The driver also reports counters_stable, which says whether
every timed repetition returned the same counts.
peak RSS: measured by a separate single-repetition process per pipeline, so
each figure belongs to one pipeline. v1 and the shipped pipeline at P are
decision-rule inputs; v2 at P is context. A probe that returns no reading
voids the entry. The driver's own vm_hwm_kb is a whole-process high-water
mark and is recorded for reference only.
version 2 context: v2-c1 over v2-cP and total v1-c1 over total v2-cP. These
are historical and enter no grade. The ceiling of the ordered schedule is
never inferred from the version 2 batch width.
"""
decision_rule = """
Frozen at registration.

A qualifying region is two or more consecutive held-out geometric entries of
one chain, by chain_index. Near-clique probes may test scaling but cannot
establish the headline; they carry headline = false and belong to no region.

Product-positive: median serial/ordered collapse >= 2.0 AND median
complete-pipeline improvement >= 1.15 over the serial-v1 pipeline (v1
collapse plus the same reducer) AND peak RSS <= 1.5x that pipeline.
Parallel-but-Amdahl-limited: serial/ordered collapse >= 2.0 without the
1.15 pipeline improvement.
Conditional: serial/ordered collapse >= 1.25 and below 2.0, or isolated
wins only.
Negative: otherwise.

Every grade reports the invalidated cost, the work inflation, the unused
window capacity (the registered upper bound on pass-tail loss), and the
reduction-time parity.
"""
cost_note = """
Sizes target seconds to minutes per entry on the pinned CPU set, as the
v0.4 and v0.5 corpora do. An entry with T collapse thread values runs
2T + 3 configurations: v2 and v1o at each value, plus v1-c1, v1p-cP, and
none. That is 7 for a headline entry and 11 for a strong-scaling probe,
each one agreement run plus REPS timed runs, plus three short peak-RSS
probes. An entry therefore costs about double what a v0.5 entry cost. The
sizes are held at the v0.5 values instead of raised, for that reason. n
falls as tau rises, because the complex grows with both.
"""

