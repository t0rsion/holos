It changes nothing else, and it was written before any registered timing.
"""

[[meta.amendments]]
number = 3
date = "2026-08-19"
title = "run 1 revealed; the routing memory clause fixed; H3 moved"
text = """
The study ran once at H3 = 83276b2 on 2026-08-18 (local/records/
north_star_run1_revealed/, study_valid=yes, every clause passed). Its CPU
scaling table showed s-cube-d1-t03-n6000 running the dense engine at 2.2
times giotto-ph's wall at one core: the routing memory clause of that H3,
56 bytes an edge against the larger of 32 MiB and a tenth of the matrix,
refused a graph of 896,373 edges on a matrix of 144 MB. The design reviewer
ratified reopening the freeze for that clause alone. At f930439 the
conversion is counted as it is built (24 bytes an edge, 24 a point, and 8)
against the larger of 32 MiB and the bytes of the compact matrix; nothing
else changed. H3 is f930439. H0, H1, and H2 stay.

Because run 1 revealed this corpus, a rerun on it is a paired audit and not
a held-out study. Public competitive claims come from the confirmation
corpus benchmarks/north_star_confirm_corpus.toml, which repeats every entry
of this corpus with new seeds and the same rules, arms, and thresholds. Run
1's records are archived beside the release as the revealed run.
"""
changes = """
It fills arm_commits.h3 with f930439, updates the routing rule text of
grading_strata to the memory clause at f930439, and names the confirmation
corpus. It changes nothing else.
"""

