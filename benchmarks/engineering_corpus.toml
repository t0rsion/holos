# Engineering corpus for the serial reduction. NOT a registered study.
#
# This file is a tuning and landing instrument, not a preregistration. It
# carries no decision rule, no grade, and no protocol that a result could
# unlock. Nothing here may be cited as evidence for a public performance
# claim; the registered studies do that, against their own frozen corpora.
#
# Tune on the disclosed engineering set, then use the disjoint landing
# set after constants are frozen. Report each input stratum separately.

[meta]
version = 2
date = "2026-08-18"
study = "engineering, not registered"
runner = "benchmarks/engine_bench.sh"
driver = "crates/engine-bench"
plan = "disclosed tuning and disjoint landing across input strata"
sets = """
tuning   Disclosed. Look at it as often as you like, rerun it after every
         change, and choose constants from it. Its numbers are development
         data and support no claim.
landing  Disjoint from the tuning set in seed and in size. It runs once,
         after the tuning is finished and the constants are frozen, to
         decide whether the change lands. The runner refuses to overwrite
         an existing landing record unless ALLOW_RERUN=1, which the record
         then discloses.
"""
strata = """
Every entry names a stratum, and the summary reports a median per stratum
before any overall median. A stratum is an input regime the engine has to
meet, not a size class.

baseline    Uniform, spherical, toroidal, and clustered clouds at several
            thresholds. The set the corpus started from.
knn         k nearest neighbour graphs, k = 8, 15, and 30, as native sparse
            input. Degrees are near-uniform and the graph is connected.
lowthresh   Large vertex counts with a threshold far below the enclosing
            radius: isolated vertices, trees, and many components.
quantized   Inputs whose distances repeat exactly: a regular lattice,
            duplicated points, and identical points. tau = 1.0 puts the
            threshold exactly on a realised distance, so the boundary
            carries ties.
skewed      Degree-skewed and clustered graphs: preferential attachment for
            a heavy degree tail, planted blocks for community structure.
nearclique  Clustered and spherical clouds at tau = 1.0, where almost every
            pair is an edge.
embedding   Euclidean clouds in 8, 32, and 128 dimensions, where distances
            concentrate and the threshold has to sit near the enclosing
            radius to keep any edge at all.
nonmetric   Weighted dissimilarities that satisfy no triangle inequality,
            with absent edges at +inf and disconnected inputs.
deepdim     Homology in dimensions 2, 3, and 4 on small inputs.
oddprime    Coefficients in Z/3 and Z/5.
collapsed   Real collapsed graphs: an ordinary input, reduced by the
            certified edge collapse, then read back as native sparse input.
memory      A sparse graph whose widening to a full matrix is quick and
            whose full matrix is not small. It measures routing regret in
            peak RSS, not in time.
"""
threshold_rule = """
Cloud entries: T = tau * R, where R is the enclosing radius of the cloud,
the minimum over i of the maximum over j of d(i, j). tau = 1.0 reproduces
the dense default threshold exactly. benchmarks/densify_to_sparse.py
computes R and T from the cloud and writes the lower-distance file and the
triplet file from the same distances, so holos and ripser read one file and
one threshold.

Graph entries: T = tau * (the largest weight the generator drew).
benchmarks/gen_graph.py drops the edges above T, so the file holds the
thresholded graph and the runner passes the same T to both tools.

tau = 1.0 puts T exactly on a realised value in both rules, which is the
threshold-boundary tie case.
"""
sampling_rule = """
Cloud entries take one cloud from gen_cloud.py N COORD_DIM SEED FAMILY.
Graph entries take one graph from gen_graph.py GENERATOR N SEED TAU PARAM
OUT. Tuning seeds are 5501 to 5573 odd, landing seeds are 7701 to 7749 odd.
The two sets share no seed and no point count, so a landing input can never
be a tuning input at another threshold. The lattice and equal families
ignore the seed; there the differing point count is what separates the
sets.

None of the seeds of the registered corpora appears here: not 42, 4201,
5301, 777, 778, 9137, 9138, 9139, 6607, 8821, 8823, 8825, or 8827. An
engineering run must not touch a registered cloud.
"""
entry_fields = """
Every entry carries id, stratum, n, tau, max_dim, modulus, seed, headline,
competitor, and input. The rest depend on input.

input = "cloud"   family and coord_dim name the cloud. The runner writes
                  both a lower-distance file and a triplet file from the
                  same distances.
input = "graph"   generator and param name the graph. The runner writes a
                  triplet file only, because no dense file of the input
                  exists to write.
collapse = true   the runner collapses the entry's graph with the certified
                  serial edge collapse and runs the reduced graph instead.
                  The barcode is unchanged, and the input becomes sparse
                  only.
driver_modes      which configurations the in-process driver times. The
                  default is "dense,sparse,auto" for an input with a dense
                  file and "sparse" for a graph. The memory stratum
                  overrides it to keep the dense arm on a graph input.
competitor        "ripser" runs the external arm, "none" skips it. The
                  reference ripser build reads no odd modulus, so the
                  oddprime stratum has no external arm; its entries still
                  compare the dense and sparse engines against each other
                  inside the driver.
"""
configurations = """
The primary total is a fresh process, timed with benchmarks/measure.py:
holos and ripser both start, read the same file at the same threshold, and
exit. Both get one warm-up run and the same number of timed repetitions.
The in-process driver keeps running beside it and supplies the phase
clocks, which are a diagnostic and not the headline.

The runner takes a list of holos builds, so one run can time the working
tree beside earlier commits. Each build times each configuration, and the
tables carry one column per arm.

auto          holos routes the input by the frozen density rule
forced-dense  holos reduces the distance matrix as it stands
forced-sparse holos converts to the thresholded graph first

All three read one file, so the routing rule is the only difference among
them, and ripser reads that file once. An arm built before
`holos --engine auto|dense|sparse` existed has no routing to force, so its
axis is the input file instead:

dense    holos reads the lower-distance file; ripser reads the same file
sparse   holos reads the triplet file with --format sparse; ripser reads
         the same file with --format sparse

The runner probes each arm's --help and picks the axis per arm.

Every configuration of every build must agree with the reference diagram
bar for bar, and holos must agree with ripser to the comparison tolerance.
A mismatch voids the entry.
"""
measures = """
per-arm total: the median fresh-process wall time of each arm, over the
timed repetitions, and the same for ripser on the same file.
ratio: holos over ripser, one per arm and configuration. Below 1.0 means
holos is faster. An entry with competitor = "none" has no ratio.
phase split: parse, distance, graph, and reduce medians from the driver,
for the working-tree build only. The reduce phase is the engine alone.
peak RSS: from the timed fresh-process runs, plus one extra
single-repetition driver process per engine entry point. The memory
stratum reads that pair.
stratum summary: the median ratio inside each stratum, per arm, with the
entry count. It is reported before any overall median, and an overall
median never stands alone.
"""
cost_note = """
The tuning set targets a runtime near an hour on four physical cores with
one arm, so it can be rerun after every change. Every further arm costs
about as much again. Most entries are small on purpose: the strata are for
coverage, not for scale.

The sparse engine on a near-complete graph is what sets the size of an
entry. Its cost grows faster than n^4 there, so a cloud at tau = 1.0 stays
at a few hundred points while a cloud at tau = 0.3 reaches n = 3000. The
sizes here keep every configuration of every entry to a few seconds. Graph
entries reach n = 40000, because a sparse graph with 40000 vertices still
holds about 35000 edges.

Cloud generation and thresholding are Python and cost O(n^2) per entry.
Graph generation is O(n * param), except knn, which is O(n^2). None of it
is timed, and on a small entry it can dominate the wall time.

ONLY takes a comma-separated list of globs over entry ids, so one stratum
can be rerun alone.
"""
headline_note = """
headline = true marks an entry whose ratio enters the overall median the
summary reports. Every entry enters its own stratum median, headline or
not. A near-clique probe, an all-equal probe, and the memory entry carry
headline = false: they test a code path rather than the geometry the engine
meets in practice.
"""

