[package]
name = "holos-tda-py"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Python bindings for exact Vietoris-Rips persistence and checked topology workflows"
license = "MIT OR Apache-2.0"
repository = "https://github.com/t0rsion/holos"
homepage = "https://github.com/t0rsion/holos"
readme = "README.md"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"] }
# A path dependency is safe in the workspace layout: each crate has its own
# directory, so maturin's sdist vendoring cannot collide with this crate's
# README/LICENSE files (the 0.2.1 failure mode in the flat layout).
holos-tda = { path = "../holos-tda" }
