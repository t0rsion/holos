[package]
name = "holos-tda-py"
version = "0.3.1"
edition = "2021"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"] }
# A path dependency is safe in the workspace layout: each crate has its own
# directory, so maturin's sdist vendoring cannot collide with this crate's
# README/LICENSE files (the 0.2.1 failure mode in the flat layout).
holos-tda = { path = "../holos-tda" }
