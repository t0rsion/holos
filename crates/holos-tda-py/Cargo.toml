[package]
name = "holos-tda-py"
version = "0.9.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Python bindings for exact Vietoris-Rips persistence and checked topology workflows"
license = "MIT OR Apache-2.0"
repository = "https://github.com/t0rsion/holos"
homepage = "https://github.com/t0rsion/holos"
readme = "README.md"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"] }
# Separate crate directories prevent sdist vendoring from overwriting
# this crate's README and license files.
holos-tda = { path = "../holos-tda" }
