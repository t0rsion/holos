[build-system]
# The lower bound keeps license files in wheels and source distributions.
requires = ["maturin>=1.9.3,<2.0"]
build-backend = "maturin"

[project]
name = "holos-tda"
version = "0.8.0"
description = "Vietoris-Rips persistence and checked degree-Rips modules"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.9"
keywords = ["topology", "tda", "persistent-homology", "rips", "ripser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/t0rsion/holos"
Repository = "https://github.com/t0rsion/holos"
Changelog = "https://github.com/t0rsion/holos/blob/main/CHANGELOG.md"

[project.scripts]
holos-tda = "holos_tda:main"

[tool.maturin]
python-source = "python"
module-name = "holos_tda._core"
exclude = ["**/__pycache__/**", "**/*.pyc"]
