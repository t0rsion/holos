[package]
name = "holos-tda"
version = "0.22.0"
edition = "2024"
rust-version = "1.85"
description = "Vietoris-Rips persistent homology with an implicit ripser-class engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/t0rsion/holos"
homepage = "https://github.com/t0rsion/holos"
documentation = "https://docs.rs/holos-tda"
keywords = ["topology", "tda", "persistent-homology", "rips"]
categories = ["science", "mathematics"]
readme = "../../README.md"
include = [
    "src/**",
    "tests/**",
    "examples/**",
    "build.rs",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

[dependencies]
rustc-hash = "2"
fast-float2 = "0.2"
clap = { version = "4", features = ["derive", "string"] }
rayon = "1"
dashmap = "6"
sha2 = "0.10"
num-rational = "0.4"
num-traits = "0.2"

[dev-dependencies]
holos-tda-check = { path = "../holos-tda-check" }
proptest = "1"

[[bin]]
name = "holos"
path = "src/bin/holos.rs"
